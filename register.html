<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href='https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900' rel='stylesheet' type='text/css'>

    <!-- Page title -->
    <title>LUNA | Responsive Admin Theme</title>

    <!-- Vendor styles -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
    <link rel="stylesheet" href="vendor/animate.css/animate.css"/>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.css"/>

    <!-- App styles -->
    <link rel="stylesheet" href="styles/stroke-icons/style.css"/>
    <link rel="stylesheet" href="styles/style.css">

    <!-- Tailwind (Play CDN; preflight off so the reset can't restyle the legacy shell) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {corePlugins: {preflight: false}};
    </script>
</head>
<body class="blank">

<!-- Wrapper-->
<div class="wrapper">


    <!-- Main content-->
    <section class="content grid grid-cols-1 place-items-center">
        <div class="back-link">
            <a href="index.html" class="btn btn-accent">Back to Dashboard</a>
        </div>

        <div class="w-full max-w-[800px] mt-[10%] p-5 animated slideInDown">


            <div class="view-header">
                <div class="header-icon">
                    <i class="ph page-header-icon ph-user-plus"></i>
                </div>
                <div class="header-title">
                    <h3>Register</h3>
                    <small>
                        Please enter your data to register.
                    </small>
                </div>
            </div>

            <div class="panel panel-filled">
                <div class="panel-body">
                    <p>

                    </p>
                    <form action="index.html" id="loginForm" class="grid grid-cols-1" novalidate>
                        <div class="grid lg:grid-cols-2 gap-x-8">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="" value="" id="username" class="form-control" name="">
                                <span class="form-text small">Your unique username to app</span>
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" value="" id="password" class="form-control" name="">
                                <span class="form-text small">Your hard to guess password</span>
                            </div>
                            <div class="form-group">
                                <label>Repeat Password</label>
                                <input type="password" value="" id="repeatpassword" class="form-control" name="">
                                <span class="form-text small">Please repeat your pasword</span>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="" value="" id="email" class="form-control" name="">
                                <span class="form-text small">Your address email to contact</span>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-accent">Register</button>
                            <a class="btn btn-default" href="login.html">Login</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </section>
    <!-- End main content-->

</div>
<!-- End wrapper-->

<!-- Vendor scripts -->
<script src="vendor/pacejs/pace.min.js"></script>
<script src="vendor/jquery/dist/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.min.js"></script>

<!-- App scripts -->
<script src="scripts/luna.js"></script>

</body>

</html>
