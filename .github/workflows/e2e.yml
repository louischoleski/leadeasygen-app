name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  app-e2e:
    name: App e2e (auth UI)
    # Pinned to 22.04: Playwright 1.40.0's `install --with-deps` predates Ubuntu
    # 24.04's libasound2 -> libasound2t64 rename and fails on ubuntu-latest.
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadeasygen
          POSTGRES_PASSWORD: leadeasygen
          POSTGRES_DB: leadeasygen_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadeasygen -d leadeasygen_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The test inbox: a local mail catcher. The API sends to it over SMTP
      # (any login accepted on the plain local port) and the specs read it
      # over its HTTP API. No secrets; nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports:
          - 1025:1025
          - 8025:8025

    env:
      # --- backend the app talks to ---
      DATABASE_URL: postgresql://leadeasygen:leadeasygen@localhost:5432/leadeasygen_dev
      JWT_SECRET: ci-e2e-jwt-secret-please-change-in-prod-0001
      VITE_API_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      # --- test inbox: the Mailpit service above (was Ethereal, whose
      # credentials expired and turned these specs red) ---
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: e2e
      SMTP_PASS: e2e
      SMTP_FROM: LeadEasyGen <noreply@leadeasygen.dev>
      E2E_MAILPIT_URL: http://localhost:8025

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      # The app e2e drives a real backend; pull the API (public repo) alongside.
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: louischoleski/leadeasygen-api
          ref: main
          path: _api

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _api/package-lock.json

      - name: Install API deps
        working-directory: _api
        run: npm ci

      - name: Install app deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start API, wait for health, run app e2e
        run: |
          ( cd _api && npm run dev > "$GITHUB_WORKSPACE/api.log" 2>&1 & )
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 2; done
          curl -sf http://localhost:3000/health || { echo "API failed to start"; cat api.log; exit 1; }
          # Playwright starts the app dev server (webServer) itself, reading VITE_API_URL.
          npm run test:e2e

      - name: API log on failure
        if: failure()
        run: cat api.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
